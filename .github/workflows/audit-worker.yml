name: Kaudit audit worker
run-name: "${{ inputs.mode || 'new' }} / ${{ inputs.system }} audit workflow"

on:
  workflow_call:
    inputs:
      system:
        description: Audit system
        required: true
        type: string
      mode:
        description: Billing audit run mode
        required: false
        default: new
        type: string
      migration_confirmation:
        description: Exact confirmation for a supervised migration mode
        required: false
        default: ''
        type: string
      diagnostic_month:
        description: YYYY-MM period for a read-only monitor diagnostic
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      system:
        description: Audit system
        required: true
        type: choice
        options:
          - billing
          - call
      mode:
        description: Billing audit run mode
        required: false
        default: new
        type: choice
        options:
          - new
          - targeted
          - requested
          - migration-0015
          - migration-0017
          - migration-billing-read-indexes
          - diagnose-requested
          - diagnose-monitor
          - diagnose-billing-performance
          - diagnose-failures
          - diagnose-openai-transcription
          - repair-june-signed-url-retries
          - requeue-june-nested-url-retries
          - reset-june-pending-reviews
          - diagnose-june-bill-audit
          - diagnose-rate-cards
          - publish-rate-card
          - finalize-june-bill-audit
          - recover-june-canary
          - recover-june-pending
      migration_confirmation:
        description: Exact confirmation required by the selected migration mode
        required: false
        type: string
      diagnostic_month:
        description: YYYY-MM period for a read-only dashboard diagnostic
        required: false
        type: string
      rate_card_id:
        description: Rate card version id for publish-rate-card
        required: false
        default: ''
        type: string
      rate_card_approver:
        description: Email of the person accountable for the rate-card approval
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: kaudit-audit-worker-${{ inputs.system }}
  cancel-in-progress: false

jobs:
  drain:
    name: "${{ inputs.mode || 'new' }} / ${{ inputs.system }}"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      NODE_ENV: production
      KAUDIT_AUTH_MODE: database
      KAUDIT_DATABASE_SESSION_SECRET: ${{ secrets.KAUDIT_DATABASE_SESSION_SECRET }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_TLS_MODE: ${{ secrets.DB_TLS_MODE }}
      DB_SSL_CA_PEM: ${{ secrets.DB_SSL_CA_PEM }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KAUDIT_ALLOWED_RECORDING_HOSTS: ${{ secrets.KAUDIT_ALLOWED_RECORDING_HOSTS }}
      KAUDIT_UNPOD_PROXY_BASE: ${{ secrets.KAUDIT_UNPOD_PROXY_BASE }}
      KAUDIT_TARGETED_REAUDIT_SCOPE_B64: ${{ secrets.KAUDIT_TARGETED_REAUDIT_SCOPE_B64 }}
      KAUDIT_CALL_AUDIT_AUTO_START: "2026-07-01 00:00:00.000000"
      KAUDIT_WORKER_DEADLINE_SECONDS: "19200"
      KAUDIT_AUDIT_LOCK_WAIT_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Drain selected audit queue
        env:
          AUDIT_SYSTEM: ${{ inputs.system }}
          AUDIT_MODE: ${{ inputs.mode }}
          DIAGNOSTIC_MONTH_INPUT: ${{ inputs.diagnostic_month }}
          MIGRATION_CONFIRMATION_INPUT: ${{ inputs.migration_confirmation }}
          RATE_CARD_ID_INPUT: ${{ inputs.rate_card_id }}
          RATE_CARD_APPROVER_INPUT: ${{ inputs.rate_card_approver }}
        run: |
          if [[ "$DB_TLS_MODE" == "disabled" ]]; then
            unset DB_SSL_CA_PEM
          fi
          if [[ "$AUDIT_SYSTEM" == "billing" ]]; then
            if [[ "$AUDIT_MODE" == "diagnose-openai-transcription" ]]; then
              unset DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD
              unset DB_TLS_MODE DB_SSL_CA_PEM
              unset KAUDIT_DATABASE_SESSION_SECRET
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              node scripts/diagnose-openai-transcription.mjs
            elif [[ "$AUDIT_MODE" == "diagnose-requested" ]]; then
              node scripts/report-billing-reaudit-health.mjs
            elif [[ "$AUDIT_MODE" == "diagnose-monitor" ]]; then
              if [[ ! "$DIAGNOSTIC_MONTH_INPUT" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ ]]; then
                echo "::error::diagnose-monitor is read-only and requires diagnostic_month in YYYY-MM format"
                exit 2
              fi
              KAUDIT_DIAGNOSTIC_MONTH="$DIAGNOSTIC_MONTH_INPUT" \
              node scripts/report-audit-monitor-health.mjs
            elif [[ "$AUDIT_MODE" == "diagnose-billing-performance" ]]; then
              unset OPENAI_API_KEY
              unset KAUDIT_DATABASE_SESSION_SECRET
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              KAUDIT_DIAGNOSTIC_MONTH="$DIAGNOSTIC_MONTH_INPUT" \
              node scripts/report-billing-read-performance.mjs
            elif [[ "$AUDIT_MODE" == "diagnose-failures" ]]; then
              node scripts/report-billing-failure-breakdown.mjs
            elif [[ "$AUDIT_MODE" == "repair-june-signed-url-retries" ]]; then
              if [[ "$MIGRATION_CONFIRMATION_INPUT" != "RESET_JUNE_SIGNED_URL_RETRIES" ]]; then
                exit 2
              fi
              unset OPENAI_API_KEY
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              KAUDIT_RETRY_REPAIR_CONFIRM=RESET_JUNE_SIGNED_URL_RETRIES \
              node scripts/repair-june-signed-url-retries.mjs
            elif [[ "$AUDIT_MODE" == "requeue-june-nested-url-retries" ]]; then
              if [[ "$MIGRATION_CONFIRMATION_INPUT" != "REQUEUE_JUNE_NESTED_URL_RETRIES" ]]; then
                exit 2
              fi
              unset OPENAI_API_KEY
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              KAUDIT_NESTED_URL_REQUEUE_CONFIRM=REQUEUE_JUNE_NESTED_URL_RETRIES \
              node scripts/requeue-june-nested-url-retries.mjs
            elif [[ "$AUDIT_MODE" == "reset-june-pending-reviews" ]]; then
              if [[ "$MIGRATION_CONFIRMATION_INPUT" != "RESET_JUNE_278_PENDING_REVIEWS" ]]; then
                exit 2
              fi
              unset OPENAI_API_KEY
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              KAUDIT_JUNE_PENDING_RESET_CONFIRM=RESET_JUNE_278_PENDING_REVIEWS \
              node scripts/reset-june-pending-review-cohort.mjs
            elif [[ "$AUDIT_MODE" == "diagnose-june-bill-audit" ]]; then
              # Read-only preview of the exact same cohort the finalizer would
              # settle. It writes no calculation, decision, or component: it
              # reports the rate-card binding and the candidate counts so the
              # money run is never the first time either is checked.
              unset OPENAI_API_KEY
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              KAUDIT_CYCLE_CLOSE_MODE=DRY-RUN \
              KAUDIT_CYCLE_CLOSE_MONTH=2026-06 \
              KAUDIT_CYCLE_CLOSE_RATE_CARD_ID=rcv-2026-02-28-v1 \
              KAUDIT_CYCLE_CLOSE_COHORT=exhausted-recording \
              KAUDIT_CYCLE_CLOSE_BATCH=50000 \
              npm run billing:cycle-close
            elif [[ "$AUDIT_MODE" == "diagnose-rate-cards" ]]; then
              # Read-only. Reports every rate card version and which D-03
              # conditions it does and does not satisfy. Changes nothing.
              unset OPENAI_API_KEY
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              node scripts/publish-kserve-rate-card.mjs
            elif [[ "$AUDIT_MODE" == "publish-rate-card" ]]; then
              # Records a rate-card approval an accountable owner has made.
              # The approver is supplied deliberately and never defaulted: an
              # approval with no name attached is not an approval.
              if [[ "$MIGRATION_CONFIRMATION_INPUT" != "PUBLISH_KSERVE_RATE_CARD" ]]; then
                exit 2
              fi
              if [[ -z "$RATE_CARD_APPROVER_INPUT" ]]; then
                echo "::error::publish-rate-card requires rate_card_approver"
                exit 2
              fi
              if [[ -z "$RATE_CARD_ID_INPUT" ]]; then
                echo "::error::publish-rate-card requires rate_card_id"
                exit 2
              fi
              unset OPENAI_API_KEY
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              KAUDIT_RATE_CARD_PUBLISH_CONFIRM=PUBLISH_KSERVE_RATE_CARD \
              KAUDIT_RATE_CARD_ID="$RATE_CARD_ID_INPUT" \
              KAUDIT_RATE_CARD_APPROVER="$RATE_CARD_APPROVER_INPUT" \
              node scripts/publish-kserve-rate-card.mjs
            elif [[ "$AUDIT_MODE" == "finalize-june-bill-audit" ]]; then
              if [[ "$MIGRATION_CONFIRMATION_INPUT" != "FINALIZE_JUNE_BILL_AUDIT" ]]; then
                exit 2
              fi
              unset OPENAI_API_KEY
              unset KAUDIT_ALLOWED_RECORDING_HOSTS
              unset KAUDIT_UNPOD_PROXY_BASE
              unset KAUDIT_TARGETED_REAUDIT_SCOPE_B64
              # Exhausted recording-backed calls ONLY. The no-recording
              # population is already resolved at zero by its own basis and
              # must not be re-priced by a run aimed at the exhausted cohort.
              KAUDIT_CYCLE_CLOSE_MODE=EXECUTE \
              KAUDIT_CYCLE_CLOSE_MONTH=2026-06 \
              KAUDIT_CYCLE_CLOSE_RATE_CARD_ID=rcv-2026-02-28-v1 \
              KAUDIT_CYCLE_CLOSE_COHORT=exhausted-recording \
              KAUDIT_CYCLE_CLOSE_BATCH=50000 \
              npm run billing:cycle-close
            elif [[ "$AUDIT_MODE" == "migration-0015" ]]; then
              if [[ "$MIGRATION_CONFIRMATION_INPUT" != "APPLY_0015" ]]; then
                exit 2
              fi
              KAUDIT_MIGRATION_CONFIRM=APPLY_0015 \
              node scripts/apply-billing-reaudit-migration.mjs
            elif [[ "$AUDIT_MODE" == "migration-0017" ]]; then
              if [[ "$MIGRATION_CONFIRMATION_INPUT" != "APPLY_0017" ]]; then
                exit 2
              fi
              KAUDIT_MIGRATION_CONFIRM=APPLY_0017 \
              npm run migration:billing-spend-lease
            elif [[ "$AUDIT_MODE" == "migration-billing-read-indexes" ]]; then
              if [[ "$MIGRATION_CONFIRMATION_INPUT" != "APPLY_BILLING_READ_INDEXES" ]]; then
                exit 2
              fi
              KAUDIT_MIGRATION_CONFIRM=APPLY_BILLING_READ_INDEXES \
              node scripts/apply-billing-read-indexes.mjs
            elif [[ "$AUDIT_MODE" == "targeted" ]]; then
              if [[ -z "$KAUDIT_TARGETED_REAUDIT_SCOPE_B64" ]]; then
                exit 2
              fi
              umask 077
              printf '%s' "$KAUDIT_TARGETED_REAUDIT_SCOPE_B64" \
                | base64 --decode \
                > "$RUNNER_TEMP/kaudit-targeted-reaudit.json"
              KAUDIT_AUDIT_SCOPE_FILE="$RUNNER_TEMP/kaudit-targeted-reaudit.json" \
              KAUDIT_AUDIT_REQUIRE_SCOPE=true \
              KAUDIT_AUDIT_REAUDIT_MODE=APPEND \
              KAUDIT_AUDIT_MODE=EXECUTE \
              KAUDIT_AUDIT_BATCH=1 \
              KAUDIT_AUDIT_CONCURRENCY=1 \
              KAUDIT_AUDIT_WATCH=false \
              npm run audit:worker
            elif [[ "$AUDIT_MODE" == "requested" ]]; then
              KAUDIT_AUDIT_REQUESTED_MODE=true \
              KAUDIT_AUDIT_MODE=EXECUTE \
              KAUDIT_AUDIT_BATCH=1 \
              KAUDIT_AUDIT_CONCURRENCY=1 \
              KAUDIT_AUDIT_WATCH=false \
              npm run audit:worker
            elif [[ "$AUDIT_MODE" == "recover-june-canary" ]]; then
              KAUDIT_AUDIT_MODE=EXECUTE \
              KAUDIT_AUDIT_BATCH=2 \
              KAUDIT_AUDIT_CONCURRENCY=1 \
              KAUDIT_AUDIT_WATCH=false \
              KAUDIT_AUDIT_DRAIN=false \
              npm run audit:worker
            elif [[ "$AUDIT_MODE" == "recover-june-pending" ]]; then
              KAUDIT_AUDIT_MODE=EXECUTE \
              KAUDIT_AUDIT_BATCH=2 \
              KAUDIT_AUDIT_CONCURRENCY=2 \
              KAUDIT_AUDIT_WATCH=false \
              KAUDIT_AUDIT_DRAIN=true \
              npm run audit:worker
            elif [[ "$AUDIT_MODE" == "new" ]]; then
              KAUDIT_AUDIT_MODE=EXECUTE \
              KAUDIT_AUDIT_BATCH=10 \
              KAUDIT_AUDIT_CONCURRENCY=10 \
              KAUDIT_AUDIT_WATCH=false \
              KAUDIT_AUDIT_DRAIN=true \
              npm run audit:worker
            else
              exit 2
            fi
          elif [[ "$AUDIT_SYSTEM" == "call" ]]; then
            if [[ "$AUDIT_MODE" != "new" ]]; then
              exit 2
            fi
            KAUDIT_CALL_AUDIT_DRAIN=true \
            KAUDIT_CALL_AUDIT_BATCH_SIZE=25 \
            npm run callaudit:worker
          else
            exit 2
          fi
      - name: Remove targeted scope
        if: always()
        run: rm -f "$RUNNER_TEMP/kaudit-targeted-reaudit.json"
