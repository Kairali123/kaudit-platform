name: Kaudit scheduled audit workers

on:
  schedule:
    # GitHub cron schedules use UTC. Offset from the top of the hour to reduce delay.
    - cron: '47 */6 * * *'
    # Daily sweep for calls the vendor supplied no recording for.
    - cron: '23 2 * * *'
    # Daily close of ended months across every settleable cohort.
    - cron: '41 3 * * *'

jobs:
  billing-audit:
    if: github.event.schedule == '47 */6 * * *'
    uses: ./.github/workflows/audit-worker.yml
    with:
      system: billing
      mode: new
    secrets: inherit

  # Settles the no-recording cohort of ENDED months at INR 0.00, the standing
  # Finance/Ops rule: no recording means no evidence to support a charge. It
  # runs in its own concurrency group, so it never delays the audit drain.
  no-recording-close:
    if: github.event.schedule == '23 2 * * *'
    uses: ./.github/workflows/audit-worker.yml
    with:
      system: billing
      mode: finalize-no-recording-auto
    secrets: inherit

  # Closes ENDED months across all three settleable cohorts, so a finished
  # month reaches a final bill without anyone dispatching a run for it. The
  # vendor-asserted cohort inside it is bounded and refuses a month whose
  # audit failed at scale; see src/billing/vendorAssertedBound.ts.
  month-close:
    if: github.event.schedule == '41 3 * * *'
    uses: ./.github/workflows/audit-worker.yml
    with:
      system: billing
      mode: finalize-month-close-auto
    secrets: inherit
