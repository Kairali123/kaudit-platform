name: Kaudit scheduled audit workers

on:
  schedule:
    # GitHub cron schedules use UTC. Offset from the top of the hour to reduce delay.
    - cron: '47 */6 * * *'

jobs:
  billing-audit:
    if: github.event.schedule == '47 */6 * * *'
    uses: ./.github/workflows/audit-worker.yml
    with:
      system: billing
      mode: new
    secrets: inherit
